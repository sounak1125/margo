name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run icons

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MARGO_GOOGLE_CLIENT_ID: ${{ secrets.MARGO_GOOGLE_CLIENT_ID }}
          MARGO_GOOGLE_CLIENT_SECRET: ${{ secrets.MARGO_GOOGLE_CLIENT_SECRET }}
        run: npm run dist -- --publish always
